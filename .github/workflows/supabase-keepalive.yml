name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada 3 días, 09:17 hora Argentina
  workflow_dispatch:           # permite ejecutarlo a mano desde Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://fbsugjqjbltvvyywfsal.supabase.co/rest/v1/cate_producto?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase respondió HTTP $code"
          test "$code" = "200"